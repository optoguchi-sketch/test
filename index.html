<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>オフィスパートナー　社内FAQ</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="app">
      <header class="topbar">
        <div>
          <p class="topbar__eyebrow">社内専用ナレッジベース</p>
          <h1 class="topbar__title">📚️オフィスパートナー　社内FAQ</h1>
          <p class="topbar__lead">
            迷わず・最速で・直感的に。検索から更新まで3クリック以内で完結する、軽量FAQ。
          </p>
        </div>
        <div class="topbar__actions">
          <button class="btn btn--primary" id="openFaqModal">＋ FAQを作成</button>
        </div>
      </header>

      <section class="setup-panel" id="setupPanel">
        <div class="setup-panel__header">
          <h2 class="setup-panel__title">共有設定チェック</h2>
          <span class="setup-panel__status" id="syncStatus">確認中</span>
        </div>
        <p class="setup-panel__desc">
          共有ストレージ（Supabase）に接続できると、全員の編集が即時反映されます。
        </p>
        <ol class="setup-panel__steps">
          <li>faq_documents に <code>id = 1</code> / <code>data = {}</code> の行を追加</li>
          <li>RLS ポリシーで anon の読み書きを許可</li>
          <li>Netlify へ再アップロード → 別端末で表示確認</li>
        </ol>
      </section>

      <section class="search-panel">
        <div class="search-panel__row">
          <label class="field-label" for="searchInput">全文検索</label>
          <div class="search-box">
            <input
              id="searchInput"
              type="search"
              placeholder="タイトル・本文・タグを検索"
              autocomplete="off"
            />
            <button class="btn btn--ghost" id="clearSearch" type="button">クリア</button>
            <div class="suggestions" id="suggestions" aria-live="polite"></div>
          </div>
          <div class="stats" id="stats"></div>
        </div>
        <div class="search-panel__row">
          <label class="field-label">タグフィルタ</label>
          <div class="chip-group" id="tagFilters"></div>
        </div>
      </section>

      <main class="content">
        <section class="category-grid">
          <section class="category-block" data-major="出品対応"></section>
          <section class="category-block" data-major="メール対応"></section>
        </section>
        <section class="category-block category-block--full" data-major="その他"></section>
      </main>
    </div>

    <div class="modal" id="faqModal" aria-hidden="true">
      <div class="modal__backdrop" data-close="true"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="faqModalTitle">
        <div class="modal__header">
          <h2 id="faqModalTitle">FAQを作成</h2>
          <button class="icon-button" data-close="true" aria-label="閉じる">✕</button>
        </div>
        <div class="modal__body">
          <label class="field-label" for="faqTitle">タイトル</label>
          <input id="faqTitle" type="text" placeholder="例：出品時の初期設定は？" />

          <label class="field-label" for="faqBody">本文（Markdown可）</label>
          <textarea id="faqBody" rows="6" placeholder="手順・注意点を入力"></textarea>

          <div class="form-grid">
            <div>
              <label class="field-label" for="faqMajor">大カテゴリ</label>
              <select id="faqMajor"></select>
            </div>
            <div>
              <label class="field-label" for="faqMiddle">中カテゴリ</label>
              <select id="faqMiddle"></select>
            </div>
          </div>

          <label class="field-label" for="faqTags">タグ（カンマ区切り）</label>
          <input id="faqTags" type="text" placeholder="例：初期設定, マニュアル" />
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" data-close="true" type="button">キャンセル</button>
          <button class="btn btn--primary" id="saveFaq" type="button">保存</button>
        </div>
      </div>
    </div>

    <div class="modal" id="categoryModal" aria-hidden="true">
      <div class="modal__backdrop" data-close="true"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="categoryModalTitle">
        <div class="modal__header">
          <h2 id="categoryModalTitle">中カテゴリ名を変更</h2>
          <button class="icon-button" data-close="true" aria-label="閉じる">✕</button>
        </div>
        <div class="modal__body">
          <label class="field-label" for="categoryName">中カテゴリ名</label>
          <input id="categoryName" type="text" />
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" data-close="true" type="button">キャンセル</button>
          <button class="btn btn--primary" id="saveCategory" type="button">変更する</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
