<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社内FAQポータル</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div class="page">
      <header class="hero">
        <div class="hero__glow"></div>
        <div class="hero__content">
          <div class="hero__icon" aria-hidden="true">📘</div>
          <p class="hero__eyebrow">チームで育てるナレッジベース</p>
          <h1 class="hero__title">社内FAQポータル</h1>
          <p class="hero__lead">
            いつでも検索、カテゴリで整理。スタッフが編集可能なFAQを集約し、サポート体験を刷新します。
          </p>
          <div class="hero__search">
            <input
              id="searchInput"
              type="search"
              placeholder="質問を検索..."
              aria-label="FAQを検索"
            />
            <button class="btn btn--ghost" id="searchAction">検索</button>
          </div>
          <div class="hero__actions">
            <button class="btn btn--primary" id="openModal">＋ 新規FAQを作成</button>
            <button class="btn btn--outline">使い方ガイド</button>
          </div>
        </div>
      </header>

      <main class="content">
        <section class="filters">
          <div class="filters__header">
            <h2>カテゴリ</h2>
            <span id="resultCount" class="filters__count">7件のFAQが見つかりました</span>
          </div>
          <div class="filters__list" id="categoryFilters">
            <button class="chip is-active" data-category="all">すべて (7)</button>
            <button class="chip" data-category="general">一般 (2)</button>
            <button class="chip" data-category="hr">人事・労務 (2)</button>
            <button class="chip" data-category="it">IT・システム (1)</button>
            <button class="chip" data-category="finance">経理・財務 (1)</button>
            <button class="chip" data-category="legal">法務・コンプライアンス (1)</button>
          </div>
        </section>

        <section class="faq" id="faqList"></section>
      </main>
    </div>

    <div class="modal" id="faqModal" aria-hidden="true">
      <div class="modal__backdrop" data-close="true"></div>
      <div class="modal__card" role="dialog" aria-modal="true" aria-labelledby="modalTitle">
        <div class="modal__header">
          <h2 id="modalTitle">新規FAQを作成</h2>
          <button class="icon-button" data-close="true" aria-label="閉じる">✕</button>
        </div>
        <div class="modal__body">
          <label class="field-label">カテゴリ</label>
          <div class="modal__chips">
            <button class="chip is-active" type="button">一般</button>
            <button class="chip" type="button">人事・労務</button>
            <button class="chip" type="button">IT・システム</button>
            <button class="chip" type="button">経理・財務</button>
            <button class="chip" type="button">法務・コンプライアンス</button>
          </div>
          <label class="field-label" for="questionInput">質問</label>
          <input id="questionInput" type="text" placeholder="よくある質問を入力してください" />
          <label class="field-label" for="answerInput">回答</label>
          <textarea id="answerInput" rows="5" placeholder="回答を入力してください"></textarea>
        </div>
        <div class="modal__footer">
          <button class="btn btn--ghost" data-close="true">キャンセル</button>
          <button class="btn btn--primary" id="createFaq">作成する</button>
        </div>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
